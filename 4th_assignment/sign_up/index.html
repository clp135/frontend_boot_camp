<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <main class="card card--signup">
      <h1 class="card__title">회원가입</h1>

      <form id="signupForm" class="signup-form" novalidate>
        <!-- 아이디 -->
        <div class="form-row">
          <label for="userId" class="form-label">아이디</label>
          <div class="form-row__inline">
            <input
              type="text"
              id="userId"
              name="userId"
              autocomplete="off"
              required
              class="input"
            />
            <button
              type="button"
              id="checkIdBtn"
              class="btn btn--secondary"
              data-role="check-id"
            >
              중복 확인
            </button>
          </div>
          <p id="idMessage" class="form-message"></p>
        </div>

        <!-- 비밀번호 -->
        <div class="form-row">
          <label for="password" class="form-label">비밀번호</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="input"
          />
          <p class="form-helper mt-1">
            8~16자, 영문/숫자/특수문자 포함, 아이디와 3글자 이상 같지 않기
          </p>
          <p id="pwMessage" class="form-message"></p>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="form-row">
          <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
          <input
            type="password"
            id="passwordConfirm"
            name="passwordConfirm"
            required
            class="input"
          />
          <p id="pwConfirmMessage" class="form-message"></p>
        </div>

        <!-- 이름 -->
        <div class="form-row">
          <label for="name" class="form-label">이름</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="input"
          />
        </div>

        <!-- 이메일 -->
        <div class="form-row">
          <label for="email" class="form-label">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="input"
          />
        </div>

        <!-- 약관 동의 -->
        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" id="agree" required />
            <span>약관에 동의합니다.</span>
          </label>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" class="btn btn--primary btn--full">
          회원가입
        </button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
