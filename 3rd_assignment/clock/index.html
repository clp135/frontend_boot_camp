<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project#1 시계</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="container">
    <h1>Project#1 시계</h1>

    <section class="clock-card">
      <!-- 배터리 표시 -->
      <div class="battery" aria-live="polite">
        <div class="battery-icon" aria-hidden="true">
          <div class="battery-cap"></div>
        </div>
        <div id="batteryText" class="battery-text">100%</div>
      </div>

      <!-- 시간 표시 -->
      <div class="row label">시간</div>
      <div id="clockDisplay" class="clock-display" aria-live="polite">----</div>

      <!-- 알람 입력 -->
      <div class="row label mt16">알람</div>
      <div class="alarm-inputs">
        <label class="sr-only" for="hours">시</label>
        <input id="hours" type="number" min="0" max="23" value="0" />
        <span class="unit">시</span>

        <label class="sr-only" for="minutes">분</label>
        <input id="minutes" type="number" min="0" max="59" value="0" />
        <span class="unit">분</span>

        <label class="sr-only" for="seconds">초</label>
        <input id="seconds" type="number" min="0" max="59" value="10" />
        <span class="unit">초</span>

        <button id="addAlarmBtn" class="btn">추가</button>
      </div>

      <!-- 알람 현황 -->
      <div class="row label mt16">알람 현황</div>
      <div id="alarmList" class="alarm-list" aria-live="polite"></div>
      <p id="limitMsg" class="limit-msg" role="alert" aria-live="assertive"></p>

      <!-- FR5: 최근 길이로 즉시 시작 -->
      <div class="recent-row">
        <div id="recentText" class="recent-text">최근 설정된 길이: 없음</div>
        <button id="quickStartBtn" class="btn outline">최근 길이로 시작</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
